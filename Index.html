<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crackers World - Ultimate Celebration Banner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .crackers-banner {
            position: relative;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            color: #ffffff;
            padding: 5rem 2rem;
            text-align: center;
            overflow: hidden;
            border-bottom: 4px solid #ff416c;
        }
        .crackers-banner::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,65,108,0.15) 0%, transparent 60%);
            pointer-events: none;
        }
        .banner-content {
            position: relative;
            z-index: 2;
            max-width: 800px;
            margin: 0 auto;
        }
        .banner-icons {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            letter-spacing: 10px;
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        .crackers-banner h1 {
            font-size: 3.5rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 1rem;
            background: linear-gradient(to right, #ff416c, #ff4b2b, #ffaa00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 5px 15px rgba(255, 65, 108, 0.3);
        }
        .crackers-banner p {
            font-size: 1.25rem;
            color: #e0e0e0;
            margin-bottom: 2rem;
            font-weight: 300;
            line-height: 1.6;
        }
        .banner-highlights {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-bottom: 2.5rem;
            flex-wrap: wrap;
        }
        .highlight-item {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 0.6rem 1.2rem;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: 500;
            color: #ffaa00;
            backdrop-filter: blur(5px);
        }
        .banner-btn-group {
            display: flex;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .banner-btn {
            padding: 0.9rem 2.5rem;
            font-size: 1.05rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            border: none;
        }
        .btn-main {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(255, 65, 108, 0.4);
        }
        .btn-main:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(255, 65, 108, 0.6);
        }
        .btn-outline {
            background: transparent;
            color: #ffffff;
            border: 2px solid #ffaa00;
        }
        .btn-outline:hover {
            background: #ffaa00;
            color: #0f0c29;
            transform: translateY(-3px);
        }
        @media (max-width: 768px) {
            .crackers-banner h1 { font-size: 2.4rem; }
            .crackers-banner p { font-size: 1rem; }
            .crackers-banner { padding: 3rem 1rem; }
        }
    </style>
</head>
<body>

    <header class="crackers-banner">
        <div class="banner-content">
            <div class="banner-icons">🎆 🎇 🧨</div>
            <h1>Crackers World</h1>
            <p>Light up your special celebrations with our dazzling, premium, and 100% safe collection of festive fireworks!</p>
            
            <div class="banner-highlights">
                <span class="highlight-item">✨ Premium Quality</span>
                <span class="highlight-item">⚡ Best Wholesale Prices</span>
                <span class="highlight-item">🛡️ Safe & Certified</span>
            </div>

            <div class="banner-btn-group">
                <a href="#catalog" class="banner-btn btn-main" onclick="alert('Exploring catalog!')">Explore Catalog</a>
                <a href="#contact" class="banner-btn btn-outline" onclick="alert('Contacting us!')">Contact Us</a>
            </div>
        </div>
    </header>

</body>
</html>
